<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Panas Website Agency</title>
    <meta
      name="description"
      content="Selected screenshot-based portfolio work for music producers."
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <div class="grain"></div>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Panas Website Agency home">
        <span class="brand-mark"></span>
        <span>Panas Website Agency</span>
        <span class="brand-tagline">Websites for music producers.</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
      <nav id="site-nav" class="site-nav">
        <a href="index.html">Home</a>
        <a href="work.html" aria-current="page">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero section reveal">
        <p class="eyebrow">Work</p>
        <h1>Concept websites</h1>
        <p class="lead">Clean, concept websites for music producers.</p>
      </section>

      <section class="section reveal">
        <div class="section-head">
          <div class="section-label">Featured project</div>
          <h2>Panasloops.eu</h2>
        </div>
        <div class="portfolio-grid">
          <figure class="portfolio-card portfolio-card-large">
            <img src="main page.png" alt="Homepage screenshot of Panasloops.eu" />
            <figcaption>Homepage view for immediate brand context.</figcaption>
          </figure>
          <figure class="portfolio-card">
            <img src="beats page.png" alt="Beats page screenshot from Panasloops.eu" />
            <figcaption>Product view showing the beat browsing experience.</figcaption>
          </figure>
          <figure class="portfolio-card">
            <img src="website-2-main-page.png" alt="Homepage screenshot of the second preview website" />
            <figcaption>Homepage view for the second preview website.</figcaption>
          </figure>
          <figure class="portfolio-card">
            <img src="website-2-beat-store.png" alt="Beat store screenshot of the second preview website" />
            <figcaption>Store view showing the second site&apos;s beat catalog.</figcaption>
          </figure>
          <figure class="portfolio-card">
            <img
              src="WEBSITE%20%233%20MAIN%20PAGE.jpg"
              alt="Homepage screenshot of the third website preview"
            />
            <figcaption>Homepage view for the third website preview.</figcaption>
          </figure>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>Panas Website Agency</p>
      <p>Websites that make producers look serious.</p>
    </footer>
  </body>
</html>
